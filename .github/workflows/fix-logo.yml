name: Corrigir logo ASSEC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar logo real ao formulário
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'rel="icon" type="image/png" href="./logo-assec.png"' not in s:
              s = s.replace(
                  '<title>ASSEC • Vou Hoje? — Emergencial</title>',
                  '<title>ASSEC • Vou Hoje? — Emergencial</title>\n<link rel="icon" type="image/png" href="./logo-assec.png"/>\n<link rel="apple-touch-icon" href="./logo-assec.png"/>\n<meta property="og:image" content="./logo-assec.png"/>'
              )

          s = re.sub(
              r'\.brandmark\{[^}]*\}',
              '.brandmark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);position:relative;z-index:1}',
              s,
              count=1
          )

          logo_css = '.brandmark img{width:100%;height:100%;object-fit:contain;padding:5px;display:block}.brandmark .logo-fallback{display:none;font-size:18px;font-weight:900;letter-spacing:-.04em}'
          if '.brandmark img{' not in s:
              s = s.replace('.hero h1{', logo_css + '.hero h1{', 1)

          replacement = '<div class="brandmark" aria-label="Logo ASSEC"><img src="./logo-assec.png?v=3" alt="ASSEC" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"/><span class="logo-fallback" aria-hidden="true">AS</span></div>'
          patterns = [
              r'<div\s+aria-hidden="true"\s+class="brandmark">.*?</div>',
              r'<div\s+class="brandmark"[^>]*>.*?</div>'
          ]
          n = 0
          for pattern in patterns:
              s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n:
                  break
          if n == 0:
              raise SystemExit('Bloco brandmark não encontrado')

          p.write_text(s, encoding='utf-8')
      - name: Publicar correção
        run: |
          git config user.name "LS System Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Exibe logo ASSEC no formulário emergencial"
          git push
